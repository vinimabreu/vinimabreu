  <text x="24" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#3FB950" font-weight="600">$ </tspan><tspan fill="#E6EDF3">uvicorn app.main:app --port 8000   # rag-chat</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3452;0.6571"/></text>
