<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img"
     aria-label="Three captured scenes: betorskip refusing a number the model worked out on its own, sequence-gate stopping a send after payment and refusing a replay, web-pilot guardrails blocking unsafe actions">
  <rect x="2" y="2" width="716" height="388" rx="12" fill="#05070A" stroke="#26313D"/>
  <circle cx="24" cy="30" r="6" fill="#FF5C5C"/><circle cx="46" cy="30" r="6" fill="#FFB000"/><circle cx="68" cy="30" r="6" fill="#37D67A"/>
  <line x1="2" y1="48" x2="718" y2="48" stroke="#26313D"/>
  <text x="92" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6B7683" opacity="0">betorskip · a bet slip read by Gemma 4 · the slip checks the model<animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0000;0.3238"/></text>
  <text x="24" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#FFB000" font-weight="600">$ </tspan><tspan fill="#D8E1E8">betorskip examples/slips/us-parlay.txt --rules examples/rules.toml --explain</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0119;0.3238"/></text>
  <text x="24" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#37D67A" font-weight="600">BET</tspan><tspan fill="#D8E1E8"> · stake 4.0% of your bankroll · break-even 23.8%</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0429;0.3238"/></text>
  <text x="24" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#6B7683">bet      PARLAY (2 LEGS) · odds 4.20 · stake $20.00 · to win $64.00</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0619;0.3238"/></text>
  <text x="24" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#FF5C5C">note     ignored returns 84: quote is not on the slip</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0810;0.3238"/></text>
  <text x="24" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#37D67A" font-weight="600">ok</tspan><tspan fill="#6B7683"> stake         20                    "$20.00"</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1190;0.3238"/></text>
  <text x="24" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#FF5C5C" font-weight="600">NO</tspan><tspan fill="#FF5C5C"> returns       84                    "$84.00"  &lt;- quote is not on the slip</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1429;0.3238"/></text>
  <text x="24" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#37D67A" font-weight="600">ok</tspan><tspan fill="#6B7683"> to_win        64                    "$64.00"</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1667;0.3238"/></text>
  <text x="24" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#37D67A" font-weight="600">ok</tspan><tspan fill="#6B7683"> total_odds    +320                  "Parlay odds +320"</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1905;0.3238"/></text>
  <text x="24" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#FFB000"># Gemma worked out $84.00 on its own · the slip says To Win $64.00</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2333;0.3238"/></text>
  <text x="24" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#FFB000"># the model proposed a number · the code checked it against the slip</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2667;0.3238"/></text>
  <g opacity="0"><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2786;0.3238"/><rect x="24" y="368" width="8" height="15" fill="#FFB000"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect></g>
  <text x="92" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6B7683" opacity="0">sequence-gate · follow-up sequence · stop before the send<animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3333;0.6571"/></text>
  <text x="24" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#FFB000" font-weight="600">$ </tspan><tspan fill="#D8E1E8">python examples/demo.py</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3452;0.6571"/></text>
  <text x="24" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#6B7683">day 0, first email     </tspan><tspan fill="#37D67A" font-weight="600">SEND</tspan><tspan fill="#6B7683">  clear  token=tok-1</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3714;0.6571"/></text>
  <text x="24" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#6B7683">day 3, reminder sms    </tspan><tspan fill="#37D67A" font-weight="600">SEND</tspan><tspan fill="#6B7683">  clear  token=tok-2</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3905;0.6571"/></text>
  <text x="24" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#D8E1E8" font-weight="600">day 4, the invoice is paid</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4143;0.6571"/></text>
  <text x="24" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#6B7683">day 7, final notice    </tspan><tspan fill="#FF5C5C" font-weight="600">STOP</tspan><tspan fill="#FF5C5C">  stopping_signal</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4381;0.6571"/></text>
  <text x="24" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#6B7683">keyed on (case, step), replay  </tspan><tspan fill="#FF5C5C" font-weight="600">SKIP</tspan><tspan fill="#FF5C5C">  already_sent  token=tok-1</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4762;0.6571"/></text>
  <text x="24" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#6B7683">contact clock    00:12 in Asia/Kolkata</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5143;0.6571"/></text>
  <text x="24" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#6B7683">decide           </tspan><tspan fill="#FF5C5C" font-weight="600">HOLD</tspan><tspan fill="#FF5C5C">  quiet_hours  retry_after=2026-09-15T02:30:00+00:00</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5381;0.6571"/></text>
  <text x="24" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#FFB000"># paid stops the send · a replay is refused · 00:12 local waits</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5810;0.6571"/></text>
  <g opacity="0"><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5929;0.6571"/><rect x="24" y="368" width="8" height="15" fill="#FFB000"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect></g>
  <text x="92" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6B7683" opacity="0">web-pilot · safety demo · guardrails enforced in code<animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6667;0.9905"/></text>
  <text x="24" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#FFB000" font-weight="600">$ </tspan><tspan fill="#D8E1E8">python examples/safety_demo.py</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6786;0.9905"/></text>
  <text x="24" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#6B7683">goal: </tspan><tspan fill="#D8E1E8" font-weight="600">Log into the account</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.7024;0.9905"/></text>
  <text x="24" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#6B7683">step 1 @ /login.html</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.7262;0.9905"/></text>
  <text x="24" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#6B7683">  proposed: </tspan><tspan fill="#D8E1E8">type "hunter2" into 'Password'</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.7500;0.9905"/></text>
  <text x="24" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#FF5C5C" font-weight="600">  BLOCKED </tspan><tspan fill="#FF5C5C"> typing into a credential or payment field is not allowed</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.7786;0.9905"/></text>
  <text x="24" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#6B7683">step 2 @ /login.html</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.8143;0.9905"/></text>
  <text x="24" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#6B7683">  proposed: </tspan><tspan fill="#D8E1E8">navigate https://example.com/steal</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.8381;0.9905"/></text>
  <text x="24" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#FF5C5C" font-weight="600">  BLOCKED </tspan><tspan fill="#FF5C5C"> outside the allowed sites</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.8667;0.9905"/></text>
  <text x="24" y="278" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#6B7683">step 3 @ /login.html</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.9024;0.9905"/></text>
  <text x="24" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#6B7683">  proposed: </tspan><tspan fill="#D8E1E8">give_up</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.9262;0.9905"/></text>
  <text x="24" y="322" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#37D67A" font-weight="600">  ok </tspan><tspan fill="#37D67A"> (gave up)</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.9524;0.9905"/></text>
  <text x="24" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#D8E1E8" font-weight="600">outcome: gave_up</tspan><tspan fill="#FFB000">   # the model proposed, the code disposed</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.9762;0.9905"/></text>
