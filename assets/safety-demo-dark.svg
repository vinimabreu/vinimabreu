  <text x="24" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#A78BFA"># grounded when the docs answer · honest when they do not</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5905;0.6571"/></text>
