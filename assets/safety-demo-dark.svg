  <text x="24" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#8B949E">step 1 @ /login.html</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0595;0.3238"/></text>
