  <text x="92" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8B949E" opacity="0">web-pilot · safety demo · guardrails enforced in code<animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0000;0.3238"/></text>
