  <text x="24" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#8B949E">   bm25 top score 0.35 · below the floor (2.5)</tspan><animate attributeName="opacity" dur="42s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5167;0.6571"/></text>
