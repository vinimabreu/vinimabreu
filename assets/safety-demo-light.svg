<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img"
     aria-label="web-pilot safety demo: credential typing and off-site navigation blocked in code">
  <rect x="2" y="2" width="716" height="388" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
  <circle cx="24" cy="30" r="6" fill="#FF5F56"/><circle cx="46" cy="30" r="6" fill="#FFBD2E"/><circle cx="68" cy="30" r="6" fill="#27C93F"/>
  <text x="92" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#57606A">web-pilot &#183; safety demo &#183; guardrails enforced in code</text>
  <line x1="2" y1="48" x2="718" y2="48" stroke="#D0D7DE"/>
  <text x="24" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#1A7F37" font-weight="600">$ </tspan><tspan fill="#1F2328">python examples/safety_demo.py</tspan><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0278;0.97"/></text>
  <text x="24" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#57606A">goal: </tspan><tspan fill="#1F2328" font-weight="600">Log into the account</tspan><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0833;0.97"/></text>
  <text x="24" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#57606A">step 1 @ /login.html</tspan><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1389;0.97"/></text>
  <text x="24" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#57606A">  proposed: </tspan><tspan fill="#1F2328">type "hunter2" into 'Password'</tspan><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1944;0.97"/></text>
  <text x="24" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#CF222E" font-weight="600">  BLOCKED </tspan><tspan fill="#CF222E"> typing into a credential or payment field is not allowed</tspan><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2611;0.97"/></text>
  <text x="24" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#57606A">step 2 @ /login.html</tspan><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3444;0.97"/></text>
  <text x="24" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#57606A">  proposed: </tspan><tspan fill="#1F2328">navigate https://example.com/steal</tspan><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4000;0.97"/></text>
  <text x="24" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#CF222E" font-weight="600">  BLOCKED </tspan><tspan fill="#CF222E"> outside the allowed sites</tspan><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4667;0.97"/></text>
  <text x="24" y="278" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#57606A">step 3 @ /login.html</tspan><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5500;0.97"/></text>
  <text x="24" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#57606A">  proposed: </tspan><tspan fill="#1F2328">give_up</tspan><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6056;0.97"/></text>
  <text x="24" y="322" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#1A7F37" font-weight="600">  ok </tspan><tspan fill="#1A7F37"> (gave up)</tspan><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6667;0.97"/></text>
  <text x="24" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" opacity="0"><tspan fill="#1F2328" font-weight="600">outcome: gave_up</tspan><tspan fill="#6E56CF">   # the model proposed, the code disposed</tspan><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.7389;0.97"/></text>
  <g opacity="0">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.7389;0.97"/>
    <rect x="556" y="341" width="8" height="15" fill="#6E56CF">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
