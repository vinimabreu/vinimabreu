<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img"
     aria-label="scrape-sentinel diffing two runs of a product catalog: one new, one removed, one changed with a price drop and stock change">
  <rect x="2" y="2" width="716" height="388" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
  <circle cx="24" cy="30" r="6" fill="#FF5F56"/><circle cx="46" cy="30" r="6" fill="#FFBD2E"/><circle cx="68" cy="30" r="6" fill="#27C93F"/>
  <text x="92" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#57606A">scrape-sentinel · catalog monitor · change detection</text>
  <line x1="2" y1="48" x2="718" y2="48" stroke="#D0D7DE"/>
  <text x="24" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5"><tspan fill="#1A7F37" font-weight="600">$ </tspan><tspan fill="#1F2328">scrape-sentinel run --source catalog.json --key sku</tspan></text>
  <text x="24" y="114" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5"><tspan fill="#6E56CF" font-weight="600">[scrape-sentinel] catalog: 1 new, 1 changed, 1 removed (2 unchanged)</tspan></text>
  <text x="24" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5"><tspan fill="#1A7F37" font-weight="600">NEW</tspan></text>
  <text x="24" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5"><tspan fill="#1A7F37">  + W-104  "Botanical Linen"</tspan></text>
  <text x="24" y="200" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5"><tspan fill="#CF222E" font-weight="600">REMOVED</tspan></text>
  <text x="24" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5"><tspan fill="#CF222E">  - W-099  "Retro Bloom"</tspan></text>
  <text x="24" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5"><tspan fill="#9A6700" font-weight="600">CHANGED</tspan></text>
  <text x="24" y="274" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5"><tspan fill="#9A6700">  ~ W-101  "Coastal Stripe"</tspan></text>
  <text x="24" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5"><tspan fill="#57606A">      price: 39.0 -&gt; 35.0</tspan></text>
  <text x="24" y="318" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5"><tspan fill="#57606A">      in_stock: True -&gt; False</tspan></text>
  <text x="24" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5"><tspan fill="#6E56CF"># what changed since the last run, down to the field</tspan></text>
</svg>
